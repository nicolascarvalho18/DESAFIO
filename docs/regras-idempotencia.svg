<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1160" viewBox="0 0 1720 1160" role="img" aria-labelledby="title desc">
<title id="title">Regras e invariantes de idempotência em pagamentos</title><desc id="desc">Regras para chave idempotente, conteúdo, concorrência, transação, timeout, outbox e deduplicação do consumidor.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f9fc"/><stop offset="1" stop-color="#edf2f7"/></linearGradient>
 <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#10233d" flood-opacity=".10"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#698097"/></marker>
 <style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#182a40}.section{font-size:12px;font-weight:750;letter-spacing:1.5px;fill:#718399}.title{font-size:37px;font-weight:750;letter-spacing:-.8px}.subtitle{font-size:16px;fill:#63758a}.head{font-size:17px;font-weight:700}.copy{font-size:13px;fill:#5d7086}.small{font-size:11px;fill:#687b90}.tag{font-size:10px;font-weight:750;letter-spacing:1px}.arrow{stroke:#698097;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
</defs>
<rect width="1720" height="1160" rx="24" fill="url(#bg)"/>
<text x="72" y="80" class="section">PAGAMENTOS · REGRAS DE NEGÓCIO</text><text x="72" y="130" class="title">O que impede a cobrança duplicada?</text><text x="72" y="162" class="subtitle">A chave só funciona como garantia quando é validada e arbitrada atomicamente pela persistência.</text>
<!-- invariants -->
<text x="72" y="220" class="section">INVARIANTES DA REQUISIÇÃO</text>
<g filter="url(#shadow)"><rect x="72" y="245" width="375" height="228" rx="16" fill="#fff" stroke="#d9e2eb"/></g><circle cx="112" cy="286" r="20" fill="#e9eff9"/><text x="106" y="292" font-size="16" font-weight="800" fill="#506b9b">1</text><text x="145" y="291" class="head">Escopo da chave</text><text x="100" y="333" class="copy">A identidade é (cliente, Idempotency-Key).</text><text x="100" y="359" class="copy">A chave deve ter 8–128 caracteres válidos.</text><text x="100" y="385" class="copy">A mesma chave em outra conta é outra intenção.</text><rect x="100" y="416" width="318" height="34" rx="8" fill="#edf2fb"/><text x="116" y="438" class="small">UNIQUE (client_id, idempotency_key)</text>
<g filter="url(#shadow)"><rect x="472" y="245" width="375" height="228" rx="16" fill="#fff" stroke="#d9e2eb"/></g><circle cx="512" cy="286" r="20" fill="#e8f4ef"/><text x="506" y="292" font-size="16" font-weight="800" fill="#16836d">2</text><text x="545" y="291" class="head">Fingerprint do pedido</text><text x="500" y="333" class="copy">Canonicaliza valor, moeda e descrição.</text><text x="500" y="359" class="copy">Calcula hash SHA-256 do conteúdo.</text><text x="500" y="385" class="copy">Valor 12.50 e 12.500 mantêm equivalência.</text><rect x="500" y="416" width="318" height="34" rx="8" fill="#eaf5f0"/><text x="516" y="438" class="small">request_hash persistido no pagamento</text>
<g filter="url(#shadow)"><rect x="872" y="245" width="375" height="228" rx="16" fill="#fff" stroke="#d9e2eb"/></g><circle cx="912" cy="286" r="20" fill="#fbf2e5"/><text x="906" y="292" font-size="16" font-weight="800" fill="#a86c25">3</text><text x="945" y="291" class="head">Arbitragem atômica</text><text x="900" y="333" class="copy">O banco decide qual request vence a corrida.</text><text x="900" y="359" class="copy">PostgreSQL usa UNIQUE + ON CONFLICT.</text><text x="900" y="385" class="copy">Só o vencedor cria pagamento e evento.</text><rect x="900" y="416" width="318" height="34" rx="8" fill="#fbf2e5"/><text x="916" y="438" class="small">Não confiar em checagem só na aplicação</text>
<g filter="url(#shadow)"><rect x="1272" y="245" width="375" height="228" rx="16" fill="#fff" stroke="#d9e2eb"/></g><circle cx="1312" cy="286" r="20" fill="#faecea"/><text x="1306" y="292" font-size="16" font-weight="800" fill="#a24f45">4</text><text x="1345" y="291" class="head">Uma transação</text><text x="1300" y="333" class="copy">Grava intenção de pagamento + Outbox.</text><text x="1300" y="359" class="copy">Se qualquer gravação falhar, faz rollback.</text><text x="1300" y="385" class="copy">Não existe pagamento sem evento pendente.</text><rect x="1300" y="416" width="318" height="34" rx="8" fill="#faeeec"/><text x="1316" y="438" class="small">Transação DB local ao serviço</text>
<rect x="72" y="484" width="1575" height="31" rx="8" fill="#e7edf4"/><text x="91" y="504" font-size="11" font-weight="650" fill="#52677f">VALIDAÇÃO DO BODY: valor maior que zero (até 4 casas decimais) · moeda com 3 letras · descrição obrigatória, até 240 caracteres</text>
<!-- decisions -->
<text x="72" y="530" class="section">DECISÃO PARA CADA RETRY</text>
<g filter="url(#shadow)"><rect x="72" y="553" width="498" height="168" rx="16" fill="#fff" stroke="#d9e2eb"/></g><rect x="72" y="553" width="8" height="168" rx="4" fill="#17836e"/><text x="102" y="592" class="tag" fill="#17836e">MESMA CHAVE + MESMO CONTEÚDO</text><text x="102" y="631" class="head">REPLAY DA OPERAÇÃO ORIGINAL</text><text x="102" y="660" class="copy">Devolve o mesmo ID; não cria segundo pagamento</text><text x="102" y="686" class="copy">nem um segundo evento outbox.</text><rect x="444" y="673" width="93" height="28" rx="7" fill="#e7f3ed"/><text x="462" y="692" class="tag" fill="#246a50">202</text>
<g filter="url(#shadow)"><rect x="611" y="553" width="498" height="168" rx="16" fill="#fff" stroke="#d9e2eb"/></g><rect x="611" y="553" width="8" height="168" rx="4" fill="#c56a5d"/><text x="641" y="592" class="tag" fill="#a24f45">MESMA CHAVE + CORPO DIFERENTE</text><text x="641" y="631" class="head">CONFLITO DE IDEMPOTÊNCIA</text><text x="641" y="660" class="copy">Compara o fingerprint já armazenado.</text><text x="641" y="686" class="copy">Recusa a intenção divergente.</text><rect x="983" y="673" width="98" height="28" rx="7" fill="#faeae7"/><text x="999" y="692" class="tag" fill="#9d493f">409</text>
<g filter="url(#shadow)"><rect x="1150" y="553" width="497" height="168" rx="16" fill="#fff" stroke="#d9e2eb"/></g><rect x="1150" y="553" width="8" height="168" rx="4" fill="#5473a3"/><text x="1180" y="592" class="tag" fill="#5473a3">TIMEOUT / RESPOSTA PERDIDA</text><text x="1180" y="631" class="head">CLIENTE RETENTA COM A MESMA CHAVE</text><text x="1180" y="660" class="copy">Se a transação já confirmou, encontra a intenção</text><text x="1180" y="686" class="copy">existente e devolve seu ID sem cobrar de novo.</text>
<!-- fault recovery -->
<text x="72" y="780" class="section">FALHAS E RECUPERAÇÃO</text>
<g filter="url(#shadow)"><rect x="72" y="802" width="750" height="168" rx="16" fill="#fff" stroke="#d9e2eb"/></g><text x="102" y="842" class="head">Falha entre commit e publicação</text><text x="102" y="873" class="copy">O pagamento e o evento continuam no banco; o publisher busca outbox pendente.</text><text x="102" y="900" class="copy">Só marca o evento como publicado após confirmação do RabbitMQ.</text><text x="102" y="927" class="copy">Se a confirmação se perder, pode publicar de novo — por isso o consumer deduplica.</text>
<g filter="url(#shadow)"><rect x="850" y="802" width="797" height="168" rx="16" fill="#fff" stroke="#d9e2eb"/></g><text x="880" y="842" class="head">Consumer recebe a mesma mensagem mais de uma vez</text><text x="880" y="873" class="copy">processed_messages tem message_id único para deduplicar a entrega.</text><text x="880" y="900" class="copy">gateway_charges tem gateway_key único (conta + chave idempotente).</text><text x="880" y="927" class="copy">Listener: até 4 tentativas; depois, mensagem vai para a DLQ.</text>
<!-- demo caveat -->
<rect x="72" y="1013" width="1575" height="94" rx="15" fill="#172a40"/><text x="102" y="1051" font-size="14" font-weight="750" fill="#fff">IMPORTANTE SOBRE A DEMONSTRAÇÃO LOCAL</text><text x="102" y="1080" font-size="12" fill="#c2d0df">H2 + dispatcher local validam o contrato e o fluxo; não provam lock distribuído, persistência PostgreSQL nem entrega RabbitMQ de produção.</text>
<text x="72" y="1135" class="small">Produção: PostgreSQL arbitra unicidade/commit · Outbox + RabbitMQ entregam eventos pelo menos uma vez · deduplicação protege efeitos repetidos.</text>
</svg>

